name: Terraform Deploy

# Trigger on push to main
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'infra/**'
      - '.github/workflows/**'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Permissions needed for OIDC
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 - Login to AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3 - Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4 - Terraform Init
      - name: Terraform Init
        working-directory: infra
        run: terraform init

      # Step 5 - Terraform Format check
      - name: Terraform Format
        working-directory: infra
        run: terraform fmt -check

      # Step 6 - Terraform Validate
      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      # Step 7 - Terraform Plan
      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
          TF_VAR_container_image: ${{ secrets.CONTAINER_IMAGE }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
        run: terraform plan

      # Step 8 - Terraform Apply
      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
          TF_VAR_container_image: ${{ secrets.CONTAINER_IMAGE }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
        run: terraform apply -auto-approve

      # Step 9 - Health check
      - name: Health Check
        run: |
          echo "Waiting for app to be ready..."
          sleep 60
          curl -f https://tm.paramsingh.co.uk || exit 1